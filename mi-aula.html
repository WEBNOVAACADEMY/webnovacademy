<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Aula · Webnova Academy</title>
<style>
:root{--bg:#050b1a;--card:#0c1a38;--line:#1b2f5c;--blue:#2f6bff;--cyan:#3cc8ff;--txt:#f3f6ff;--mut:#9fb0d3;--err:#ff6b7a;--ok:#35d49a;--warn:#ffb84d;--r:18px}
*{box-sizing:border-box;margin:0}body{min-height:100vh;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;
 background-image:radial-gradient(700px 400px at 80% -5%,#1b3fa088,transparent),radial-gradient(600px 400px at -10% 60%,#0a5a9a44,transparent)}
a{color:inherit;text-decoration:none}.grad{background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:#050b1acc;backdrop-filter:blur(12px)}
.bar{width:min(1000px,92%);margin:auto;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0}
.brand{display:flex;align-items:center;gap:8px;font-weight:800}.brand img{height:42px;mix-blend-mode:screen}
nav{display:flex;align-items:center;gap:14px;font-size:.9rem;color:var(--mut);flex-wrap:wrap}nav a.on,nav a:hover{color:var(--txt)}
.out{background:none;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.85rem}
main{width:min(1000px,92%);margin:auto;padding:36px 0 60px}h1{font-size:clamp(1.6rem,4vw,2.2rem)}.lead{color:var(--mut);margin:6px 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.card{background:linear-gradient(180deg,var(--card),#081227);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.3s}.card:hover{border-color:var(--blue);box-shadow:0 0 30px #2f6bff33}
.portada{height:130px;background:linear-gradient(135deg,#143a9a,#0a2a5a) center/cover;display:grid;place-items:center;font:700 2.4rem ui-monospace,monospace;color:#ffffffaa}
.body{padding:20px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.tags span{font-size:.72rem;padding:3px 10px;border-radius:99px;background:#2f6bff22;color:var(--cyan)}
.card h3{margin-bottom:6px}.card p{color:var(--mut);font-size:.9rem}.precio{margin:12px 0;font-weight:700;font-size:1.1rem}
.btn{display:inline-block;padding:11px 18px;border-radius:12px;font-weight:600;border:0;color:#fff;cursor:pointer;font-size:.92rem;background:linear-gradient(135deg,var(--blue),#1a8fff);box-shadow:0 0 20px #2f6bff44}
.btn.g{background:none;border:1px solid var(--line);box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid}
.b-pendiente_de_pago{color:var(--warn);border-color:var(--warn)}.b-en_revision{color:var(--cyan);border-color:var(--cyan)}.b-pago_confirmado{color:#9ad0ff;border-color:#9ad0ff}.b-acceso_habilitado{color:var(--ok);border-color:var(--ok)}.b-pago_rechazado{color:var(--err);border-color:var(--err)}
.user{padding:16px 20px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:6px 24px}.user small{display:block;color:var(--mut);font-size:.75rem}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--mut);font-size:.85rem;margin-bottom:12px}.meta b{color:var(--txt);font-weight:600}
.msg{padding:12px 14px;border-radius:12px;font-size:.87rem;background:#3cc8ff14;border:1px solid #3cc8ff55;color:#cdeeff;margin-bottom:12px}.msg.bad{background:#ff6b7a14;border-color:var(--err);color:#ffd3d8}.msg.ok{background:#35d49a14;border-color:var(--ok);color:#c8f5e3}
#aviso{display:none;margin-top:18px}.vacio{padding:28px;text-align:center;color:var(--mut)}
</style>

<main><h1>Mi <span class="grad">Aula</span></h1>
<p class="lead">Tus inscripciones y el estado de cada una.</p>
<div class="card user" id="user"></div>
<div id="lista"><div class="vacio">Cargando tus inscripciones...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://idmkxsempojxepfhhcie.supabase.co","sb_publishable_bud4Jlh9raHIgpUM7JG40Q_jkwNp_zo");
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CLP=n=>n==null?"Precio por definir":"Desde $"+Number(n).toLocaleString("es-CL")+" CLP";
async function sesion(){
  const {data:{session}}=await sb.auth.getSession(), b=$("sesion");
  b.textContent=session?"Cerrar sesión":"Iniciar sesión";
  b.onclick=async()=>{if(session)await sb.auth.signOut();location.href="iniciar-sesion.html"};
  return session;
}
const ETIQ={pendiente_de_pago:"Pendiente de pago",en_revision:"En revisión",pago_confirmado:"Pago confirmado",acceso_habilitado:"Acceso habilitado",pago_rechazado:"Pago rechazado"};
const PAGO={pendiente_de_pago:"Pago pendiente",en_revision:"En verificación",pago_confirmado:"Verificado",acceso_habilitado:"Verificado",pago_rechazado:"No validado"};
function mensaje(e){
  if(e==="pendiente_de_pago")return ['','Tu inscripción está en proceso de confirmación. Te enviaremos un correo electrónico cuando tu pago haya sido verificado.'];
  if(e==="en_revision")return ['','Estamos confirmando tu pago. Tu pago se encuentra en proceso de revisión. La confirmación puede tardar hasta 24 horas. Una vez verificado, recibirás un correo electrónico con la información de tu inscripción y el acceso a tu curso.'];
  if(e==="pago_confirmado")return ['ok','Tu pago fue confirmado. Estamos habilitando el acceso a tu curso.'];
  if(e==="pago_rechazado")return ['bad','No pudimos validar tu pago y el curso continúa bloqueado. Escríbenos para consultar tu situación.'];
  return null;
}
(async function(){
  const ses=await sesion();
  if(!ses){location.href="iniciar-sesion.html";return}
  const u=ses.user,m=u.user_metadata||{};
  $("user").innerHTML=`<div><small>Alumno</small>${esc((m.nombre||"")+" "+(m.apellidos||""))}</div><div><small>Correo electrónico</small>${esc(u.email)}</div>`;
  const {data,error}=await sb.from("inscripciones").select("id,estado,created_at,cursos(nombre,nivel)").order("created_at",{ascending:false});
  if(error){$("lista").innerHTML='<div class="vacio">No pudimos cargar tus inscripciones. Inténtalo de nuevo más tarde.</div>';return}
  if(!data.length){$("lista").innerHTML='<div class="card vacio">Aún no tienes inscripciones.<br><br><a class="btn" href="cursos.html">Explorar cursos</a></div>';return}
  $("lista").innerHTML=data.map(i=>{
    const ms=mensaje(i.estado), curso=i.cursos||{};
    return `<article class="card body" style="margin-bottom:16px">
      <div class="row"><h3>${esc(curso.nombre)}</h3><span class="badge b-${esc(i.estado)}">${esc(ETIQ[i.estado]||i.estado)}</span></div>
      <div class="meta"><span>Fecha de inscripción: <b>${new Date(i.created_at).toLocaleDateString("es-CL")}</b></span><span>Estado del pago: <b>${esc(PAGO[i.estado]||"")}</b></span></div>
      ${ms?`<div class="msg ${ms[0]}">${ms[1]}</div>`:""}
      ${i.estado==="acceso_habilitado"?'<button class="btn" data-aula>Acceder al curso</button>':'<button class="btn" disabled>Curso bloqueado</button>'}
    </article>`}).join("");
  $("lista").addEventListener("click",e=>{if(e.target.closest("[data-aula]"))alert("El aula virtual (módulos, clases y videos) se construirá en una etapa siguiente.")});
})();
</script></body></html>
